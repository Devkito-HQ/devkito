name: Rebuild website

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild website
        env:
          DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::WEBSITE_DEPLOY_HOOK_URL is not set."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$DEPLOY_HOOK_URL"
